<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>SOLEORA — Order desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">

<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="s-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g></symbol>
  <symbol id="s-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></g></symbol>
  <symbol id="s-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></g></symbol>
  <symbol id="s-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></g></symbol>
  <symbol id="s-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g></symbol>
  <symbol id="s-out" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></g></symbol>
</svg>

<!-- LOGIN -->
<section class="gate" id="gate">
  <form class="gate__card" id="gateForm">
    <img class="gate__logo" src="assets/logo.png" alt="SOLEORA" width="1200" height="672" />
    <h1>Order desk</h1>
    <p>Enter the store passcode to see today's orders.</p>
    <input type="password" id="gateKey" placeholder="Store passcode" autocomplete="current-password" />
    <button class="btn btn--dark btn--block" type="submit">Open dashboard</button>
    <p class="gate__note" id="gateNote">Default passcode: <b>soleora2026</b> — change it in <code>apps-script/Code.gs</code>.</p>
    <a class="gate__back" href="index.html">← Back to store</a>
  </form>
</section>

<!-- DASHBOARD -->
<div class="adm" id="adm" hidden>
  <header class="adm__bar">
    <div class="adm__brand">
      <img class="logo__img" src="assets/logo-mark.png" alt="" width="1907" height="723" />
      <span><b>SOLEORA</b><em>Order desk</em></span>
    </div>
    <div class="adm__barTools">
      <span class="conn" id="connState">Checking…</span>
      <button class="btn btn--outline btn--sm" id="refreshBtn"><svg class="ico"><use href="#s-refresh"/></svg> Refresh</button>
      <button class="btn btn--outline btn--sm" id="exportBtn"><svg class="ico"><use href="#s-download"/></svg> Export CSV</button>
      <a class="btn btn--ghost btn--sm" href="index.html">View store</a>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><svg class="ico"><use href="#s-out"/></svg></button>
    </div>
  </header>

  <main class="adm__main">
    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="panel__head">
        <h2>Orders</h2>
        <div class="panel__tools">
          <label class="srch"><svg class="ico"><use href="#s-search"/></svg><input id="ordSearch" placeholder="Search order ID, name, phone, city" /></label>
          <div class="select">
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option>New</option><option>Confirmed</option><option>Packed</option>
              <option>Shipped</option><option>Delivered</option><option>Cancelled</option>
            </select>
          </div>
        </div>
      </div>
      <div class="tablewrap">
        <table class="tbl">
          <thead><tr>
            <th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th>
          </tr></thead>
          <tbody id="ordBody"></tbody>
        </table>
      </div>
      <p class="tbl__empty" id="ordEmpty" hidden>No orders match this view yet.</p>
    </section>
  </main>
</div>

<div class="modal" id="ordModal" hidden><div class="modal__card" id="ordCard"></div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
